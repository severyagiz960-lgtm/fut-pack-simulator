<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hesap Oluştur — 10BTV</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚽</text></svg>" />
  <style>
    :root{
      --bg:#0f172a;
      --card-bg:#1e293b;
      --text:#f1f5f9;
      --text-muted:#94a3b8;
      --accent:#3b82f6;
      --border:#334155;
      --danger:#ef4444;
      --ok:#22c55e;
    }
    *{ margin:0; padding:0; box-sizing:border-box; }
    body{
      font-family:'Inter',sans-serif;
      background:var(--bg);
      color:var(--text);
      min-height:100vh;
      padding:2rem 1rem;
    }
    .container{ max-width:900px; margin:0 auto; }
    header{
      text-align:center;
      margin-bottom:2rem;
      padding-bottom:1.5rem;
      border-bottom:2px solid var(--border);
    }
    .back-link{
      display:inline-flex;
      align-items:center;
      gap:.5rem;
      color:var(--text-muted);
      text-decoration:none;
      margin-bottom:1rem;
      font-weight:700;
      transition:.25s;
    }
    .back-link:hover{ color:var(--accent); transform:translateX(-3px); }
    .title{ font-size:2.1rem; font-weight:900; margin-bottom:.3rem; }

    .card{
      background:linear-gradient(135deg, rgba(59,130,246,0.08), rgba(139,92,246,0.05));
      border:1px solid var(--border);
      border-radius:18px;
      padding:1.6rem;
      margin-top:1.4rem;
    }

    .form{
      display:flex;
      flex-direction:column;
      gap:1rem;
      max-width:520px;
      margin:1.1rem auto 0;
    }

    label{
      display:block;
      color:var(--text-muted);
      font-weight:800;
      margin-bottom:.4rem;
      font-size:.95rem;
    }

    input{
      width:100%;
      padding:.85rem .95rem;
      border-radius:14px;
      background:rgba(30,41,59,0.85);
      border:1px solid var(--border);
      color:var(--text);
      outline:none;
      font-size:1rem;
    }

    input:focus{
      border-color:rgba(59,130,246,0.85);
      box-shadow:0 0 0 3px rgba(59,130,246,0.22);
    }

    .actions{
      display:flex;
      gap:.75rem;
      flex-wrap:wrap;
      justify-content:flex-end;
      margin-top:.25rem;
    }

    .btn{
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: .75rem 1rem;
      border-radius: 14px;
      cursor:pointer;
      font-weight:900;
      transition: all .2s;
      font-family:'Inter',sans-serif;
    }
    .btn:hover{
      transform:translateY(-2px);
      border-color: rgba(59,130,246,0.85);
      box-shadow: 0 12px 30px rgba(59,130,246,0.15);
    }
    .btn.primary{
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      border:none;
    }

    .status{ min-height:20px; font-weight:800; color:var(--text-muted); }
    .status.error{ color:var(--danger); }
    .status.ok{ color:var(--ok); }

    .hint{ color:var(--text-muted); font-size:.92rem; line-height:1.5; margin-top:.8rem; text-align:center; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <a class="back-link" href="oyunlar.html">← Oyunlar</a>
      <div class="title">Hesap Oluştur</div>
    </header>

    <div class="card">
      <div class="hint">Hesap bilgileriniz veritabanında güvenle saklanır.</div>

      <form class="form" id="registerForm">
        <div>
          <label for="username">Kullanıcı Adı</label>
          <input id="username" type="text" autocomplete="username" placeholder="Kullanıcı adı" />
        </div>

        <div>
          <label for="password">Parola</label>
          <input id="password" type="password" autocomplete="new-password" placeholder="Parola" />
        </div>

        <div class="status" id="status"></div>

        <div class="actions">
          <button class="btn" type="button" id="goLogin">Girişe Git</button>
          <button class="btn primary" type="submit">Hesap Oluştur</button>
        </div>
      </form>
    </div>
  </div>

  <script src="supabase-config.js"></script>
  <script src="supabase-client.js"></script>
  <script>
    const statusEl = document.getElementById('status');
    const usernameEl = document.getElementById('username');
    const passwordEl = document.getElementById('password');

    function setStatus(msg, type) {
      statusEl.textContent = msg;
      statusEl.className = 'status' + (type ? (' ' + type) : '');
    }

    document.getElementById('goLogin').addEventListener('click', () => {
      window.location.href = 'giris.html';
    });

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const u = usernameEl.value.trim();
      const p = passwordEl.value;

      if (!u || !p) {
        setStatus('Kullanıcı adı ve parola gir.', 'error');
        return;
      }

      if (u.length < 3) {
        setStatus('Kullanıcı adı en az 3 karakter.', 'error');
        return;
      }

      if (p.length < 4) {
        setStatus('Parola en az 4 karakter.', 'error');
        return;
      }

      setStatus('Hesap oluşturuluyor...', '');

      try {
        // Supabase Auth ile kayıt
        const result = await window.SB.register(u, p);
        
        if (!result.ok) {
          setStatus(result.message || 'Kayıt başarısız.', 'error');
          return;
        }

        // Otomatik giriş yap
        const loginResult = await window.SB.login(u, p);
        
        if (loginResult.ok) {
          localStorage.setItem('10BTV_last_user', u);
          setStatus('Kayıt başarılı. Ana sayfaya yönlendiriliyor...', 'ok');
          setTimeout(() => { window.location.href = 'index.html'; }, 700);
        } else {
          setStatus('Kayıt başarılı. Giriş sayfasına yönlendiriliyor...', 'ok');
          setTimeout(() => { window.location.href = 'giris.html'; }, 700);
        }
      } catch (err) {
        console.error(err);
        setStatus('Bağlantı hatası. Lütfen tekrar deneyin.', 'error');
      }
    });
  </script>
</body>
</html>
