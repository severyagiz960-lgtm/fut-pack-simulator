<!DOCTYPE html>
<html lang="tr">
<head>  
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Paneli — 10BTV</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚽</text></svg>" />
  <style>
    :root{
      --bg:#0f172a; --card-bg:#1e293b; --text:#f1f5f9; --text-muted:#94a3b8;
      --accent:#3b82f6; --border:#334155; --ok:#22c55e; --danger:#ef4444;
      --danger-bg:rgba(239,68,68,0.12); --gold:#fbbf24;
    }
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:2rem 1rem;}
    .container{max-width:1400px;margin:0 auto;}
    header{text-align:center;margin-bottom:2rem;padding-bottom:1.5rem;border-bottom:2px solid var(--border);position:relative;}
    .back-link{display:inline-flex;align-items:center;gap:.5rem;color:var(--text-muted);text-decoration:none;position:absolute;left:0;top:0;margin:1rem 0 0 0;font-weight:700;}
    .back-link:hover{color:var(--accent);}
    h1{font-size:2rem;font-weight:900;margin-top:0.25rem;}

    /* Tabs */
    .tabs{display:flex;gap:.5rem;margin-bottom:1.5rem;border-bottom:1px solid var(--border);padding-bottom:0;overflow-x:auto;}
    .tab-btn{background:transparent;border:none;color:var(--text-muted);padding:.7rem 1.3rem;border-radius:12px 12px 0 0;font-weight:700;font-size:.95rem;cursor:pointer;transition:all .2s;font-family:'Inter',sans-serif;white-space:nowrap;}
    .tab-btn:hover{color:var(--text);background:rgba(255,255,255,0.04);}
    .tab-btn.active{color:#fff;background:linear-gradient(135deg,#3b82f6,#6366f1);box-shadow:0 -2px 12px rgba(59,130,246,0.2);}
    .tab-page{display:none;animation:fadeIn .25s ease;}
    .tab-page.active{display:block;}
    @keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

    .card{background:linear-gradient(135deg,rgba(59,130,246,0.10),rgba(139,92,246,0.06));border:1px solid var(--border);border-radius:18px;padding:1.25rem;}
    .toolbar{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;margin-bottom:1rem;}
    .btn{background:var(--card-bg);border:1px solid var(--border);color:var(--text);padding:.6rem 1rem;border-radius:12px;cursor:pointer;font-weight:700;transition:.2s;font-family:'Inter',sans-serif;font-size:.85rem;white-space:nowrap;}
    .btn:hover{border-color:var(--accent);box-shadow:0 12px 30px rgba(59,130,246,0.15);transform:translateY(-2px);}
    .btn.danger{background:var(--danger-bg);border-color:rgba(239,68,68,0.35);color:#fecaca;}
    .btn.danger:hover{border-color:var(--danger);}
    .btn.primary{background:linear-gradient(135deg,#3b82f6,#6366f1);border:none;color:#fff;}
    .btn.success{background:linear-gradient(135deg,#22c55e,#16a34a);border:none;color:#fff;}
    .btn.small{padding:.35rem .6rem;font-size:.75rem;}
    .btn:disabled{opacity:.5;cursor:not-allowed;transform:none!important;}
    .form-inline{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;}
    .form-inline input,.form-inline select{background:rgba(30,41,59,0.85);border:1px solid var(--border);color:var(--text);padding:.5rem .7rem;border-radius:10px;outline:none;font-size:.85rem;font-family:'Inter',sans-serif;}
    .form-inline input:focus,.form-inline select:focus{border-color:rgba(59,130,246,0.8);box-shadow:0 0 0 3px rgba(59,130,246,0.25);}
    .form-inline input{width:140px;}
    .form-inline select{width:auto;min-width:80px;}
    .table-wrap{overflow-x:auto;border-radius:14px;border:1px solid var(--border);}
    table{width:100%;border-collapse:collapse;font-size:.85rem;}
    th,td{padding:.6rem .5rem;border-bottom:1px solid rgba(255,255,255,0.06);text-align:left;}
    th{color:var(--text-muted);font-weight:800;background:rgba(30,41,59,0.55);white-space:nowrap;}
    .muted{color:var(--text-muted);}
    .pill{display:inline-flex;align-items:center;gap:.35rem;padding:.25rem .6rem;border-radius:999px;border:1px solid rgba(255,255,255,0.10);background:rgba(255,255,255,0.05);font-weight:900;font-size:.8rem;}
    .admin-badge{display:inline-flex;align-items:center;gap:.25rem;padding:.2rem .5rem;border-radius:6px;background:rgba(251,191,36,0.15);color:var(--gold);font-weight:700;font-size:.75rem;}
    .edit-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:.5rem;margin-bottom:.8rem;}
    .edit-field{display:flex;flex-direction:column;gap:.25rem;}
    .edit-field label{font-size:.7rem;color:var(--text-muted);font-weight:700;text-transform:uppercase;letter-spacing:.3px;}
    .edit-field input{background:rgba(30,41,59,0.85);border:1px solid var(--border);color:var(--text);padding:.4rem .5rem;border-radius:8px;outline:none;font-size:.82rem;font-family:'Inter',sans-serif;}
    .edit-field input:focus{border-color:rgba(59,130,246,0.8);}
    .status-msg{min-height:20px;font-weight:700;font-size:.9rem;margin-top:.5rem;}
    .status-msg.error{color:var(--danger);} .status-msg.ok{color:var(--ok);}

    /* Gates */
    .gate-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.72);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;z-index:9999;padding:1rem;}
    .gate-overlay.active{display:flex;}
    .login-modal{width:100%;max-width:520px;background:#0b1220;border:1px solid rgba(255,255,255,0.08);border-radius:22px;padding:1.5rem;box-shadow:0 25px 60px rgba(0,0,0,0.6);}
    .login-top{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;margin-bottom:1rem;}
    .login-title{font-size:1.35rem;font-weight:900;}
    .login-close{width:40px;height:40px;border-radius:12px;border:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.06);color:var(--text);cursor:pointer;font-size:1.2rem;transition:all .2s;flex-shrink:0;}
    .login-close:hover{transform:rotate(90deg);border-color:rgba(59,130,246,0.45);background:rgba(59,130,246,0.12);}
    .confirm-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.72);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:10001;padding:1rem;}
    .confirm-overlay.active{display:flex;}
    .confirm-box{width:100%;max-width:420px;background:#0b1220;border:1px solid rgba(239,68,68,0.3);border-radius:22px;padding:1.5rem;box-shadow:0 25px 60px rgba(0,0,0,0.6);}
    .confirm-title{font-size:1.2rem;font-weight:900;margin-bottom:.5rem;}
    .confirm-text{color:var(--text-muted);line-height:1.5;margin-bottom:1rem;}
    .confirm-actions{display:flex;gap:.75rem;justify-content:flex-end;}

    @media(max-width:768px){.edit-grid{grid-template-columns:repeat(3,1fr);}}
    @media(max-width:500px){.edit-grid{grid-template-columns:repeat(2,1fr);}}
  </style>
</head>
<body>
<div class="container">
  <header>
    <a class="back-link" href="oyunlar.html">← Geri</a>
    <h1>Admin Paneli</h1>
  </header>

  <!-- Admin gate -->
  <div class="gate-overlay" id="adminOverlay">
    <div class="login-modal">
      <div class="login-top">
        <div><div class="login-title">Admin Giriş</div><div class="muted" style="margin-top:.35rem;font-size:.9rem;">admin / 1234</div></div>
        <button class="login-close" id="adminClose">×</button>
      </div>
      <div style="display:flex;flex-direction:column;gap:.85rem;">
        <div><label style="display:block;color:var(--text-muted);font-size:.9rem;font-weight:700;margin-bottom:.4rem;">Kullanıcı Adı</label>
          <input id="adminUsername" type="text" style="width:100%;padding:.85rem .95rem;border-radius:14px;background:rgba(30,41,59,0.85);border:1px solid var(--border);color:var(--text);outline:none;font-size:1rem;" /></div>
        <div><label style="display:block;color:var(--text-muted);font-size:.9rem;font-weight:700;margin-bottom:.4rem;">Parola</label>
          <input id="adminPassword" type="password" style="width:100%;padding:.85rem .95rem;border-radius:14px;background:rgba(30,41,59,0.85);border:1px solid var(--border);color:var(--text);outline:none;font-size:1rem;" /></div>
        <div id="adminGateStatus" class="muted" style="font-weight:700;font-size:.92rem;"></div>
        <div style="display:flex;gap:.75rem;justify-content:flex-end;"><button class="btn primary" id="adminLoginBtn">Giriş Yap</button></div>
      </div>
    </div>
  </div>

  <!-- Confirm modal -->
  <div class="confirm-overlay" id="confirmOverlay">
    <div class="confirm-box">
      <div class="confirm-title">⚠️ Onay</div>
      <div class="confirm-text" id="confirmText"></div>
      <div class="confirm-actions"><button class="btn" id="confirmCancel">İptal</button><button class="btn danger" id="confirmAction">Sil</button></div>
    </div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab-btn active" data-tab="users">👥 Kullanıcılar</button>
    <button class="tab-btn" data-tab="players">⚽ Oyuncular</button>
  </div>

  <!-- ===== USERS TAB ===== -->
  <div class="tab-page active" id="tab-users">
    <div class="card">
      <div class="toolbar">
        <div><span class="muted">Kayıtlı kullanıcı: </span><span id="userCount" class="pill">0</span></div>
        <button class="btn" id="refreshUsersBtn">🔄 Yenile</button>
      </div>
      <div class="table-wrap">
        <table><thead><tr><th style="width:22%">Kullanıcı</th><th style="width:12%">Rol</th><th>Şifre</th><th style="width:15%">Bakiye</th><th style="width:10%">ID</th><th style="width:10%">İşlem</th></tr></thead><tbody id="usersTbody"></tbody></table>
      </div>
      <div class="status-msg" id="userStatus"></div>
    </div>
  </div>

  <!-- ===== PLAYERS TAB ===== -->
  <div class="tab-page" id="tab-players">
    <div class="card">
      <div class="toolbar">
        <div><span class="muted">Toplam oyuncu: </span><span id="playerCount" class="pill">0</span></div>
        <button class="btn" id="refreshPlayersBtn">🔄 Yenile</button>
      </div>

      <!-- Player editor -->
      <div style="background:rgba(15,23,42,0.5);border:1px solid var(--border);border-radius:14px;padding:1rem;margin-bottom:1rem;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.8rem;flex-wrap:wrap;gap:.5rem;">
          <div style="font-weight:700;font-size:1rem;">✏️ <span id="editorTitle">Yeni Oyuncu</span></div>
          <div class="form-inline">
            <select id="playerSelect" style="min-width:180px;"><option value="">— Yeni oyuncu ekle —</option></select>
            <button class="btn small" id="loadPlayerBtn">Yükle</button>
          </div>
        </div>
        <div class="edit-grid" id="playerEditor"></div>
        <div style="display:flex;gap:.5rem;flex-wrap:wrap;">
          <button class="btn success" id="savePlayerBtn">💾 Kaydet</button>
          <button class="btn danger" id="deletePlayerBtn">🗑️ Sil</button>
          <button class="btn" id="clearEditorBtn">Temizle</button>
        </div>
        <div class="status-msg" id="playerStatus"></div>
      </div>

      <div class="table-wrap">
        <table><thead><tr><th>ID</th><th>İsim</th><th>Poz</th><th>OVR</th><th>Değer</th><th>Gol</th><th>Asist</th><th>Maç</th><th>PAC</th><th>PYS</th><th>DRB</th><th>PAS</th><th>SHO</th><th>DEF</th></tr></thead><tbody id="playersTbody"></tbody></table>
      </div>
    </div>
  </div>
</div>

<script>
const API = { credentials: 'include' };
async function fetchMe(){const r=await fetch('/api/me',API).catch(()=>null);if(!r)return null;return r.json().catch(()=>null);}
async function loginAs(u,p){const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p}),credentials:'include'});const d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw new Error(d?.message||'Giriş başarısız');return d;}

// Elements
const $=id=>document.getElementById(id);
const gateOverlay=$('adminOverlay'),adminClose=$('adminClose'),adminLoginBtn=$('adminLoginBtn');
const adminUserEl=$('adminUsername'),adminPassEl=$('adminPassword'),adminGateStatus=$('adminGateStatus');
const confirmOverlay=$('confirmOverlay'),confirmText=$('confirmText'),confirmCancel=$('confirmCancel'),confirmAction=$('confirmAction');
const userStatus=$('userStatus'),playerStatus=$('playerStatus');

function setStatus(el,msg,type){el.textContent=msg;el.className='status-msg'+(type?' '+type:'');}
function setGateStatus(msg,type){adminGateStatus.textContent=msg;adminGateStatus.style.color=type==='error'?'var(--danger)':type==='ok'?'var(--ok)':'var(--text-muted)';}
function openGate(){gateOverlay.classList.add('active');adminUserEl.value='';adminPassEl.value='';setGateStatus('');setTimeout(()=>adminUserEl.focus(),0);}
function closeGate(){gateOverlay.classList.remove('active');}
adminClose.onclick=closeGate;
adminLoginBtn.onclick=async()=>{
  const u=(adminUserEl.value||'').trim(),p=adminPassEl.value||'';
  if(!u||!p){setGateStatus('Kullanıcı adı ve parola gir.','error');return;}
  setGateStatus('Giriş yapılıyor...');
  try{await loginAs(u,p);setGateStatus('Başarılı.','ok');closeGate();loadUsers();loadPlayers();}catch(e){setGateStatus(e.message||'Hata','error');}
};
adminPassEl.onkeydown=e=>{if(e.key==='Enter')adminLoginBtn.click();};

// Confirm helper
let confirmCallback=null;
function showConfirm(msg,onConfirm){
  confirmText.textContent=msg;confirmOverlay.classList.add('active');
  confirmCallback=onConfirm;
}
confirmCancel.onclick=()=>{confirmOverlay.classList.remove('active');confirmCallback=null;};
confirmAction.onclick=()=>{if(confirmCallback){confirmCallback();confirmCallback=null;}confirmOverlay.classList.remove('active');};

// Tabs
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.onclick=()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.tab-page').forEach(p=>p.classList.remove('active'));
    btn.classList.add('active');
    $(`tab-${btn.dataset.tab}`).classList.add('active');
  };
});

  // ===== USERS =====
  async function loadUsers(){
    const tbody=$('usersTbody');tbody.innerHTML='<tr><td colspan="6" class="muted" style="text-align:center;padding:2rem;">Yükleniyor...</td></tr>';
    const me=await fetchMe();if(!me||!me.ok||!me.isAdmin){openGate();return;}
    try{
      const r=await fetch('/api/admin/users',API),d=await r.json().catch(()=>({}));
      if(!r.ok||!d.ok){tbody.innerHTML=`<tr><td colspan="6" class="muted">${d?.message||'Hata'}</td></tr>`;return;}
      const users=d.users||[];$('userCount').textContent=users.length;
      if(!users.length){tbody.innerHTML='<tr><td colspan="6" class="muted" style="text-align:center;padding:2rem;">Henüz kullanıcı yok.</td></tr>';return;}
      tbody.innerHTML=users.map((u,i)=>{
        const isAdmin=!!u.is_admin,pid='p_'+u.id+'_'+i;
        return `<tr>
          <td><strong>${u.username}</strong></td>
          <td>${isAdmin?'<span class="admin-badge">👑 Admin</span>':'<span class="muted">Kullanıcı</span>'}</td>
          <td><div style="display:flex;gap:.35rem;flex-wrap:wrap;">
            <input type="password" id="${pid}" class="small" style="width:140px;padding:.4rem .5rem;border-radius:8px;background:rgba(30,41,59,0.85);border:1px solid var(--border);color:var(--text);outline:none;font-size:.8rem;" placeholder="Yeni şifre" />
            <button class="btn small" onclick="togglePass('${pid}',this)">👁️</button>
            <button class="btn small primary" data-up="${u.id}">💾</button></div></td>
          <td>
            <div style="display: flex; gap: 0.3rem; align-items: center;">
              <input type="number" id="coin_input_${u.id}" placeholder="Miktar" style="width: 70px; background: rgba(30,41,59,0.85); border: 1px solid var(--border); color: var(--text); padding: .3rem .5rem; border-radius: 8px; font-size: .8rem; outline: none;" value="100">
              <button class="btn small success" data-add-coins="${u.id}">🪙 Ekle</button>
            </div>
          </td>
          <td class="muted" style="font-size:.8rem;">#${u.id}</td>
          <td>${isAdmin?'<span class="muted" style="font-size:.75rem;">—</span>':`<button class="btn small danger" data-del="${u.id}" data-name="${u.username}">🗑️</button>`}</td>
        </tr>`;
      }).join('');
      tbody.querySelectorAll('button[data-up]').forEach(b=>b.onclick=async()=>{
        const id=b.getAttribute('data-up'),inp=document.getElementById('p_'+id+'_0')||document.getElementById('p_'+id+'_1')||document.querySelector(`input[id^="p_${id}_"]`);
        const pass=inp?.value?.trim()||'';if(pass.length<4){setStatus(userStatus,'❌ Şifre en az 4 karakter.','error');return;}
        b.disabled=true;b.textContent='⏳';
        try{const r=await fetch(`/api/admin/users/${id}/password`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pass}),credentials:'include'});
          const d=await r.json();if(!r.ok||!d.ok)throw new Error(d?.message);setStatus(userStatus,'✅ Şifre güncellendi.','ok');if(inp)inp.value='';
        }catch(e){setStatus(userStatus,'❌ '+e.message,'error');}finally{b.disabled=false;b.textContent='💾';}
      });
      tbody.querySelectorAll('button[data-add-coins]').forEach(b=>b.onclick=async()=>{
        const id=b.getAttribute('data-add-coins');
        b.disabled=true;
        const oldText = b.textContent;
        b.textContent='⏳';
        try{
          const r=await fetch(`/api/admin/users/${id}/add-coins`,{method:'POST',credentials:'include'});
          const d=await r.json();
          if(!r.ok||!d.ok)throw new Error(d?.message);
          setStatus(userStatus,`✅ Kullanıcıya ${amount} Altın eklendi.`,'ok');
        }catch(e){
          setStatus(userStatus,'❌ '+e.message,'error');
        }finally{
          b.disabled=false;
          b.textContent=oldText;
        }
      });
      tbody.querySelectorAll('button[data-del]').forEach(b=>b.onclick=()=>{
        const id=b.getAttribute('data-del'),name=b.getAttribute('data-name');
        showConfirm(`"${name}" kullanıcısını sil?`,async()=>{
          try{const r=await fetch(`/api/admin/users/${id}`,{method:'DELETE',credentials:'include'});const d=await r.json();if(!r.ok||!d.ok)throw new Error(d?.message);
            setStatus(userStatus,'✅ Silindi: '+name,'ok');loadUsers();
          }catch(e){setStatus(userStatus,'❌ '+e.message,'error');}
        });
      });
    }catch(e){setStatus(userStatus,'❌ Server hatası.','error');}
  }
$('refreshUsersBtn').onclick=loadUsers;

function togglePass(id,btn){const inp=document.getElementById(id);if(!inp)return;const isPass=inp.type==='password';inp.type=isPass?'text':'password';btn.textContent=isPass?'🙈':'👁️';}

// ===== PLAYERS =====
const FIELD_NAMES=['name','pos','role','overall','value','pac','pys','drb','pas','sho','def','div','han','kic','ref','spe','pos_stat','goals','assists','matches'];
const FIELD_LABELS={'name':'İsim','pos':'Pozisyon','role':'Rol','overall':'OVR','value':'Değer(M)','pac':'PAC','pys':'PYS','drb':'DRB','pas':'PAS','sho':'SHO','def':'DEF','div':'DIV','han':'HAN','kic':'KIC','ref':'REF','spe':'SPE','pos_stat':'POS','goals':'Gol','assists':'Asist','matches':'Maç'};
const FIELD_TYPES={'name':'text','pos':'text','role':'select','overall':'number','value':'number','pac':'number','pys':'number','drb':'number','pas':'number','sho':'number','def':'number','div':'number','han':'number','kic':'number','ref':'number','spe':'number','pos_stat':'number','goals':'number','assists':'number','matches':'number'};
let editingPlayerId=null;

function buildEditor(data){
  const container=$('playerEditor');container.innerHTML='';
  FIELD_NAMES.forEach(f=>{
    const val=data?.[f]??'';
    const div=document.createElement('div');div.className='edit-field';
    const label=document.createElement('label');label.textContent=FIELD_LABELS[f]||f;
    div.appendChild(label);
    if(FIELD_TYPES[f]==='select'){
      const sel=document.createElement('select');sel.id='ef_'+f;sel.style.cssText='background:rgba(30,41,59,0.85);border:1px solid var(--border);color:var(--text);padding:.4rem .5rem;border-radius:8px;outline:none;font-size:.82rem;font-family:Inter,sans-serif;';
      ['field','keeper'].forEach(o=>{const opt=document.createElement('option');opt.value=o;opt.textContent=o==='field'?'Futbolcu':'Kaleci';if(o===val)opt.selected=true;sel.appendChild(opt);});
      div.appendChild(sel);
    }else{
      const inp=document.createElement('input');inp.id='ef_'+f;inp.type=FIELD_TYPES[f]||'text';inp.value=val;
      div.appendChild(inp);
    }
    container.appendChild(div);
  });
}

function getEditorData(){
  const d={};FIELD_NAMES.forEach(f=>{const el=document.getElementById('ef_'+f);if(el)d[f]=el.value;});
  ['overall','value','pac','pys','drb','pas','sho','def','div','han','kic','ref','spe','pos_stat','goals','assists','matches'].forEach(f=>{if(d[f]!==undefined)d[f]=Number(d[f])||0;});
  return d;
}

async function loadPlayers(){
  const tbody=$('playersTbody');tbody.innerHTML='<tr><td colspan="14" class="muted" style="text-align:center;padding:2rem;">Yükleniyor...</td></tr>';
  const me=await fetchMe();if(!me||!me.ok||!me.isAdmin){openGate();return;}
  try{
    const r=await fetch('/api/players'),d=await r.json();
    if(!r.ok||!d.ok||!d.players)throw new Error('Yüklenemedi');
    const players=d.players;$('playerCount').textContent=players.length;
    
    // Populate select
    const sel=$('playerSelect');sel.innerHTML='<option value="">— Yeni oyuncu ekle —</option>'+players.map(p=>`<option value="${p.id}">#${p.id} ${p.name} (${p.pos})</option>`).join('');
    
    tbody.innerHTML=players.map(p=>`<tr style="cursor:pointer" data-pid="${p.id}">
      <td class="muted">#${p.id}</td>
      <td><strong>${p.name}</strong></td>
      <td><span style="color:${p.role==='keeper'?'#4ade80':'#60a5fa'};font-weight:700;">${p.pos}</span></td>
      <td style="font-weight:800;color:${p.overall>=85?'#fbbf24':p.overall>=80?'#a855f7':p.overall>=75?'#3b82f6':p.overall>=70?'#22c55e':'#94a3b8'}">${p.overall}</td>
      <td style="color:#60a5fa;">${p.value}M€</td>
      <td style="font-weight:700;color:#fbbf24;">${p.goals||0}</td>
      <td style="font-weight:700;color:#60a5fa;">${p.assists||0}</td>
      <td>${p.matches||0}</td>
      <td>${p.pac}</td><td>${p.pys}</td><td>${p.drb}</td><td>${p.pas}</td><td>${p.sho}</td><td>${p.def}</td>
    </tr>`).join('');
    
    // Click row to edit
    tbody.querySelectorAll('tr[data-pid]').forEach(tr=>{
      tr.onclick=()=>{
        const id=tr.getAttribute('data-pid');
        const p=players.find(x=>x.id==id);if(!p)return;
        editingPlayerId=p.id;$('editorTitle').textContent=p.name;
        buildEditor(p);$('loadPlayerBtn').textContent='Yüklendi ✓';setTimeout(()=>{$('loadPlayerBtn').textContent='Yükle';},2000);
        document.querySelector('.tab-btn[data-tab="players"]').scrollIntoView({behavior:'smooth'});
      };
    });
    
  }catch(e){setStatus(playerStatus,'❌ Yükleme hatası.','error');}
}

$('refreshPlayersBtn').onclick=loadPlayers;

$('loadPlayerBtn').onclick=()=>{
  const id=$('playerSelect').value;if(!id){setStatus(playerStatus,'','');return;}
  fetch('/api/players/'+id,API).then(r=>r.json()).then(d=>{
    if(!d.ok||!d.player){setStatus(playerStatus,'❌ Oyuncu bulunamadı.','error');return;}
    const p=d.player;editingPlayerId=p.id;$('editorTitle').textContent=p.name;buildEditor(p);
  }).catch(e=>setStatus(playerStatus,'❌ Hata.','error'));
};

$('savePlayerBtn').onclick=async()=>{
  const data=getEditorData();if(!data.name||!data.pos){setStatus(playerStatus,'❌ İsim ve pozisyon gerekli.','error');return;}
  const btn=$('savePlayerBtn');btn.disabled=true;btn.textContent='⏳';
  try{
    let url,method;
    if(editingPlayerId){url='/api/admin/players/'+editingPlayerId;method='PUT';}else{url='/api/admin/players';method='POST';}
    const r=await fetch(url,{method,headers:{'Content-Type':'application/json'},body:JSON.stringify(data),credentials:'include'});
    const d=await r.json();if(!r.ok||!d.ok)throw new Error(d?.message||'Hata');
    setStatus(playerStatus,editingPlayerId?'✅ Güncellendi.':'✅ Eklendi.','ok');
    editingPlayerId=null;$('editorTitle').textContent='Yeni Oyuncu';buildEditor({});loadPlayers();
  }catch(e){setStatus(playerStatus,'❌ '+e.message,'error');}
  finally{btn.disabled=false;btn.textContent='💾 Kaydet';}
};

$('deletePlayerBtn').onclick=()=>{
  if(!editingPlayerId){setStatus(playerStatus,'⚠️ Önce bir oyuncu seç.','error');return;}
  showConfirm('Bu oyuncuyu sil? Geri alınamaz.',async()=>{
    try{const r=await fetch('/api/admin/players/'+editingPlayerId,{method:'DELETE',credentials:'include'});const d=await r.json();if(!r.ok||!d.ok)throw new Error(d?.message);
      setStatus(playerStatus,'✅ Silindi.','ok');editingPlayerId=null;$('editorTitle').textContent='Yeni Oyuncu';buildEditor({});loadPlayers();
    }catch(e){setStatus(playerStatus,'❌ '+e.message,'error');}
  });
};

$('clearEditorBtn').onclick=()=>{editingPlayerId=null;$('editorTitle').textContent='Yeni Oyuncu';buildEditor({});setStatus(playerStatus,'','');};

// Init
(async ()=>{
  const me=await fetchMe();
  if(me&&me.ok&&me.isAdmin){loadUsers();loadPlayers();}else{openGate();}
})();
</script>
</body>
</html>
