[build]
# public klasörü zaten projenin kökü olduğu için "." kullanıyoruz
publish = "."
command = "echo 'static only'"

secrets_scan_enabled = false

[functions]
directory = "netlify/functions"

# --- Auth API'leri ---
[[redirects]]
from = "/api/register"
to = "/.netlify/functions/register"
status = 200
force = true

[[redirects]]
from = "/api/login"
to = "/.netlify/functions/login"
status = 200
force = true

[[redirects]]
from = "/api/me"
to = "/.netlify/functions/me"
status = 200
force = true

[[redirects]]
from = "/api/logout"
to = "/.netlify/functions/logout"
status = 200
force = true

# --- Admin Kullanıcı API'leri (önce spesifik, sonra genel) ---
[[redirects]]
from = "/api/admin/users/:id/add-coins"
to = "/.netlify/functions/admin-user-add-coins"
status = 200
force = true

[[redirects]]
from = "/api/admin/users/:id/password"
to = "/.netlify/functions/admin-user-password"
status = 200
force = true

[[redirects]]
from = "/api/admin/users/:id"
to = "/.netlify/functions/admin-user-delete"
status = 200
force = true

[[redirects]]
from = "/api/admin/users"
to = "/.netlify/functions/admin-users"
status = 200
force = true

# --- Admin Oyuncu API'leri ---
[[redirects]]
from = "/api/admin/players/:id"
to = "/.netlify/functions/api-proxy"
status = 200
force = true

[[redirects]]
from = "/api/admin/players"
to = "/.netlify/functions/api-proxy"
status = 200
force = true

# --- Public API'ler ---
[[redirects]]
from = "/api/players/:id"
to = "/.netlify/functions/api-proxy"
status = 200
force = true

[[redirects]]
from = "/api/players"
to = "/.netlify/functions/api-proxy"
status = 200
force = true

[[redirects]]
from = "/api/mycards"
to = "/.netlify/functions/mycards"
status = 200
force = true

[[redirects]]
from = "/api/openpack"
to = "/.netlify/functions/openpack"
status = 200
force = true

[[redirects]]
from = "/api/claim-reward"
to = "/.netlify/functions/claim-reward"
status = 200
force = true

[[redirects]]
from = "/api/coins"
to = "/.netlify/functions/coins"
status = 200
force = true

[[redirects]]
from = "/api/buy-pack"
to = "/.netlify/functions/buy-pack"
status = 200
force = true

